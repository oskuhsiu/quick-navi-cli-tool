[package]
name = "qnav"
version = "0.1.3"
edition = "2024"
rust-version = "1.88"
description = "Fast directory-only terminal column navigation"
publish = false

[dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
crossterm = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustix = { version = "1", features = ["fs", "process"] }
libc = "0.2"
tempfile = "3"
unicode-width = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
